# Configuration Jekyll
# brand : nom court affiché en haut à gauche (header/logo).
# title : titre long utilisé pour la balise <title> et les partages réseaux sociaux (SEO).
brand: Verrie Bad Trip
title: Signer la pétition ! Contre la ferme des 560 veaux à Verrie.
description: L'horreur pour les veaux et l'environnement aux portes de Saumur et de Gennes-Val-de-Loire. Signez la pétition !
lang: fr

signatures: Déjà plus de 5500 signatures ! (dont plus de 2600 du Maine et Loire)

# baseurl : à remplir seulement si le site est servi sur une sous-URL
# (ex. "/mon-repo" pour https://pseudo.github.io/mon-repo). Laisser vide sinon.
baseurl: ""
url: "https://verrie-bad-trip.houla.net"

# Image affichée lors du partage sur les réseaux sociaux (Facebook, X, WhatsApp…)
image: /assets/images/verrie-elevage-560-veaux-agissons.jpg

# Fichiers à ne pas publier
exclude:
  - README.md
